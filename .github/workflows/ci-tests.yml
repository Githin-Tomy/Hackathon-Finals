name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        run: |
          echo "Running test suite..."
          # For demo purposes, we will check if a dummy failing test exists.
          # If you want to force a failure to show the AI catching it, you can
          # purposely break a test in the PR!
          if [ -d "backend/tests" ]; then
            pytest backend/tests/ || echo "Tests failed! (AI will catch this)"
          else
            echo "No tests found, skipping..."
          fi
